version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ucchash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ielts_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ucchash-network

  # NestJS API Backend
  api-nestjs:
    build:
      context: ./apps/api-nestjs
      dockerfile: Dockerfile
    container_name: ucchash-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ielts_platform
      JWT_SECRET: /sN5dkTVyvuMsgjFhBZWbhWSX29qOa5uVxTdQNo40nc=
      JWT_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ucchash-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Django Exam System
  exam-django:
    build:
      context: ./apps/exam-django
      dockerfile: Dockerfile
    container_name: ucchash-exam
    restart: unless-stopped
    environment:
      SECRET_KEY: django-insecure-docker-change-in-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,exam-django
      DATABASE_NAME: ielts_platform
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      JWT_SECRET: /sN5dkTVyvuMsgjFhBZWbhWSX29qOa5uVxTdQNo40nc=
      NESTJS_API_URL: http://api-nestjs:4000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:4000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      api-nestjs:
        condition: service_healthy
    volumes:
      - django_media:/app/media
      - django_static:/app/staticfiles
    networks:
      - ucchash-network
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py populate_tests &&
             python manage.py collectstatic --noinput &&
             gunicorn exam_system.wsgi:application --bind 0.0.0.0:8000"

  # Next.js Landing Page (Optional - for development)
  landing-nextjs:
    build:
      context: ./apps/landing-nextjs
      dockerfile: Dockerfile
    container_name: ucchash-landing
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_EXAM_URL: http://localhost:8000
    ports:
      - "3000:3000"
    networks:
      - ucchash-network

volumes:
  postgres_data:
    driver: local
  django_media:
    driver: local
  django_static:
    driver: local

networks:
  ucchash-network:
    driver: bridge
